<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1D21" />

    <!-- Primary SEO -->
    <title>Ahmed Albabli — Graphic Designer &amp; UI/UX Designer</title>
    <meta
      name="description"
      content="Portfolio of Ahmed Albabli (Ahbabli), a graphic designer and UI/UX designer. Explore work across logo design, branding, UI/UX, print, and social media design."
    />
    <meta name="author" content="Ahmed Albabli" />
    <link rel="canonical" href="https://ahbabli.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ahmed Albabli — Graphic Designer & UI/UX Designer" />
    <meta
      property="og:description"
      content="Portfolio of Ahmed Albabli (Ahbabli), a graphic designer and UI/UX designer specializing in branding, print, and digital design."
    />
    <meta property="og:image" content="/images/profile.jpg" />
    <meta property="og:url" content="https://ahbabli.netlify.app/" />
    <meta property="og:site_name" content="Ahbabli Design" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ahmed Albabli — Graphic Designer & UI/UX Designer" />
    <meta
      name="twitter:description"
      content="Portfolio of Ahmed Albabli (Ahbabli), a graphic designer and UI/UX designer."
    />
    <meta name="twitter:image" content="/images/profile.jpg" />

    <!-- Fonts: Patua One (display) + Work Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static, hidden duplicate of the contact form.
      Netlify's build bot scans the built HTML (not the React app) to
      detect forms, so this markup must exist here — do not remove it.
      It must stay in sync with the field names used in
      src/components/Contact.jsx.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
